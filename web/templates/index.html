<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Tablet Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            margin-top: 30px;
        }
        .card {
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            background: white;
            padding: 20px;
        }
        video, canvas {
            border-radius: 15px;
            border: 2px solid #ddd;
            max-width: 100%;
        }
        .result {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 15px;
        }
        .logs {
            height: 400px;
            overflow-y: auto;
            background: #f8f9fa;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .counter {
            font-size: 1.1rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row">
        <!-- Левая колонка -->
        <div class="col-md-8">
            <div class="card">
                <h1 class="mb-4 text-primary text-center">TVELVision</h1>
                <video id="video" autoplay></video>
                <br>
                <button class="btn btn-success mt-3" onclick="takeSnapshot()">📸 Сделать снимок</button>
                <canvas id="canvas" class="mt-3 d-none"></canvas>
                <div id="result" class="result text-dark"></div>
            </div>
        </div>

        <!-- Правая колонка -->
        <div class="col-md-4">
            <div class="card">
                <h3 class="text-secondary">📋 Логи системы</h3>
                <div id="logs" class="logs"></div>

                <div class="counter text-success">✅ Принято: <span id="accepted">0</span></div>
                <div class="counter text-danger">❌ Отбраковано: <span id="rejected">0</span></div>
            </div>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const resultDiv = document.getElementById('result');
    const logsDiv = document.getElementById('logs');
    const acceptedSpan = document.getElementById('accepted');
    const rejectedSpan = document.getElementById('rejected');

    let acceptedCount = 0;
    let rejectedCount = 0;

    // Включаем камеру
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(err => {
            console.error("Ошибка доступа к камере: ", err);
        });

    function logMessage(msg) {
        const now = new Date().toLocaleTimeString();
        logsDiv.innerHTML = `[${now}] ${msg}<br>` + logsDiv.innerHTML;
    }

    function takeSnapshot() {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.classList.remove("d-none");

        resultDiv.innerHTML = "⏳ Анализируем изображение...";
        logMessage("Снимок отправлен на анализ");

        // Заглушка (имитация анализа модели)
        setTimeout(() => {
            const detected = Math.random() > 0.5; // случайный результат
            if (detected) {
                resultDiv.innerHTML = "✅ Таблетка обнаружена";
                acceptedCount++;
                acceptedSpan.innerText = acceptedCount;
                logMessage("✅ Принята таблетка");
            } else {
                resultDiv.innerHTML = "❌ Не таблетка (отбраковано)";
                rejectedCount++;
                rejectedSpan.innerText = rejectedCount;
                logMessage("❌ Отбраковка");
            }
        }, 1500);
    }
</script>
</body>
</html>
